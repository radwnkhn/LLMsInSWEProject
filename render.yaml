services:
  - type: web
    name: alibi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && ./scripts/download_pose_model.sh
    startCommand: uvicorn app.asgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: POSE_MODEL_PATH
        value: models/pose_landmarker_full.task
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: claude
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
