services:
  - type: web
    name: alibi-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: POSE_MODEL_PATH
        value: models/pose_landmarker_full.task
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: claude
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
